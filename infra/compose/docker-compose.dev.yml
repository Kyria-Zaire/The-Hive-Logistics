services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: thl-postgres-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thl_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thl_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-thl_dev}
    volumes:
      - thl_postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    # DEV email sink (ENVIRONMENTS.md): captures notifications, never delivers to real recipients.
    # Image healthcheck is built in (/mailpit readyz).
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    container_name: thl-mailpit-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  thl_postgres_dev_data:
