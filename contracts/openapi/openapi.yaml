openapi: 3.1.0
info:
  title: THE HIVE LOGISTICS — API publique V1
  version: 1.0.1
  description: |
    Contrat public V1 (leads Contact et Devis). Source de vérité des interfaces HTTP.
    PRD v0.1.4 — THL-ARCH-001 / 001A. Same-origin PROD (`servers.url: /`). Exemples fictifs.
  contact:
    name: Kyria (Tech Lead)
servers:
  - url: /
tags:
  - name: quote-requests
  - name: contact-messages
  - name: health
paths:
  /api/v1/quote-requests:
    post:
      tags: [quote-requests]
      operationId: createQuoteRequest
      summary: Créer une demande de devis
      description: |
        Pipeline ADR-004. Turnstile uniquement après validation Pydantic et verrou idempotence (nouvelle opération).
        Réponse 201/200 uniquement après commit PostgreSQL.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationIdRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequestCreate'
            examples:
              fictifComplet:
                summary: Exemple fictif
                value:
                  turnstile_token: "0.FAKE_TURNSTILE_TOKEN_EXAMPLE_ONLY"
                  honeypot: ""
                  privacy_acknowledgement: true
                  first_name: "Alex"
                  last_name: "Martin"
                  email: "alex.martin@example.invalid"
                  phone: "+33 6 01 02 03 04"
                  service: "convoyage_premium"
                  departure_city: "Lyon"
                  departure_postal_code: "69002"
                  arrival_city: "Paris"
                  arrival_postal_code: "75008"
                  preferred_timing:
                    kind: "period"
                    period_text: "Semaine du 15 au 22 octobre 2026"
                  vehicle_category: "premium_sport"
                  vehicle_make: "Porsche"
                  vehicle_model: "911"
                  vehicle_rolling: true
      responses:
        '201':
          description: Demande créée
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedFalse'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadSubmissionAccepted'
        '200':
          description: Replay idempotent
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedTrue'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadSubmissionAccepted'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/contact-messages:
    post:
      tags: [contact-messages]
      operationId: createContactMessage
      summary: Créer un message contact
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationIdRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageCreate'
            examples:
              fictif:
                value:
                  turnstile_token: "0.FAKE_TURNSTILE_TOKEN_EXAMPLE_ONLY"
                  honeypot: ""
                  privacy_acknowledgement: true
                  first_name: "Sam"
                  last_name: "Dupont"
                  email: "sam.dupont@example.invalid"
                  subject: "information"
                  message: "Bonjour, j'aimerais en savoir plus sur vos services."
                  phone: "+33 6 05 06 07 08"
      responses:
        '201':
          description: Message enregistré
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedFalse'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadSubmissionAccepted'
        '200':
          description: Replay idempotent
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedTrue'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadSubmissionAccepted'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableProblem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: Liveness
      responses:
        '200':
          description: Processus vivant
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
  /api/v1/health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: Readiness (PostgreSQL)
      responses:
        '200':
          description: Prêt
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
        '503':
          description: Non prêt
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationIdResponse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 (RFC 9562). Portée distincte par endpoint.
      schema:
        type: string
        format: uuid
        maxLength: 36
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    CorrelationIdRequest:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identifiant de corrélation non sensible ; validé ou remplacé par le serveur.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]+$'
  headers:
    CorrelationIdResponse:
      description: Identifiant de corrélation de la requête
      schema:
        type: string
        maxLength: 64
    IdempotencyReplayedFalse:
      schema:
        type: string
        enum: ['false']
    IdempotencyReplayedTrue:
      schema:
        type: string
        enum: ['true']
  schemas:
    PublicReference:
      type: string
      description: Identifiant d'échange DEC-007 (pas secret, pas auth)
      pattern: '^THL-[0-9]{8}-[0-9A-HJKMNP-TV-Z]{8}$'
      examples:
        - THL-20260912-7K3M9Q2X
    LeadSubmissionAccepted:
      type: object
      additionalProperties: false
      required: [public_reference, status, created_at]
      properties:
        public_reference:
          $ref: '#/components/schemas/PublicReference'
        status:
          type: string
          const: received
        created_at:
          type: string
          format: date-time
    ServiceType:
      type: string
      enum:
        - convoyage_premium
        - fleet_coordination
        - automotive_logistics
        - vehicle_preparation
    VehicleCategory:
      type: string
      enum:
        - city_sedan
        - suv_4x4
        - premium_sport
        - light_commercial
        - classic_collector
        - other
    ContactSubject:
      type: string
      enum:
        - information
        - quote
        - partnership
        - other
    ContactPreference:
      type: string
      enum:
        - email
        - phone
        - no_preference
    PreferredTimingExactDate:
      type: object
      additionalProperties: false
      required: [kind, exact_date]
      properties:
        kind:
          type: string
          const: exact_date
        exact_date:
          type: string
          format: date
    PreferredTimingPeriod:
      type: object
      additionalProperties: false
      required: [kind, period_text]
      properties:
        kind:
          type: string
          const: period
        period_text:
          type: string
          minLength: 3
          maxLength: 500
    PreferredTiming:
      oneOf:
        - $ref: '#/components/schemas/PreferredTimingExactDate'
        - $ref: '#/components/schemas/PreferredTimingPeriod'
    QuoteRequestCreateBase:
      type: object
      additionalProperties: false
      required:
        - turnstile_token
        - honeypot
        - privacy_acknowledgement
        - first_name
        - last_name
        - email
        - phone
        - service
        - departure_city
        - departure_postal_code
        - arrival_city
        - arrival_postal_code
        - preferred_timing
        - vehicle_category
        - vehicle_make
        - vehicle_model
        - vehicle_rolling
      properties:
        turnstile_token:
          type: string
          minLength: 10
          maxLength: 2048
          writeOnly: true
        honeypot:
          type: string
          maxLength: 200
          writeOnly: true
          description: Doit être vide ; toute valeur non vide → 403 REQUEST_DENIED sans Turnstile
        privacy_acknowledgement:
          type: boolean
          const: true
        first_name:
          type: string
          minLength: 1
          maxLength: 80
        last_name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 6
          maxLength: 32
          pattern: "^[+0-9().\\s-]+$"
        service:
          $ref: '#/components/schemas/ServiceType'
        departure_city:
          type: string
          minLength: 1
          maxLength: 120
        departure_postal_code:
          type: string
          minLength: 4
          maxLength: 12
        arrival_city:
          type: string
          minLength: 1
          maxLength: 120
        arrival_postal_code:
          type: string
          minLength: 4
          maxLength: 12
        preferred_timing:
          $ref: '#/components/schemas/PreferredTiming'
        vehicle_category:
          $ref: '#/components/schemas/VehicleCategory'
        vehicle_category_other_detail:
          type: string
          minLength: 2
          maxLength: 200
        vehicle_make:
          type: string
          minLength: 1
          maxLength: 80
        vehicle_model:
          type: string
          minLength: 1
          maxLength: 80
        vehicle_rolling:
          type: boolean
        company:
          type: string
          maxLength: 160
        special_constraints:
          type: string
          maxLength: 2000
        additional_message:
          type: string
          maxLength: 4000
        contact_preference:
          $ref: '#/components/schemas/ContactPreference'
    QuoteRequestCreate:
      allOf:
        - $ref: '#/components/schemas/QuoteRequestCreateBase'
        - if:
            properties:
              vehicle_category:
                const: other
            required: [vehicle_category]
          then:
            required: [vehicle_category_other_detail]
          else:
            not:
              required: [vehicle_category_other_detail]
            properties:
              vehicle_category_other_detail: false
    ContactMessageCreate:
      type: object
      additionalProperties: false
      required:
        - turnstile_token
        - honeypot
        - privacy_acknowledgement
        - first_name
        - last_name
        - email
        - subject
        - message
      properties:
        turnstile_token:
          type: string
          minLength: 10
          maxLength: 2048
          writeOnly: true
        honeypot:
          type: string
          maxLength: 200
          writeOnly: true
        privacy_acknowledgement:
          type: boolean
          const: true
        first_name:
          type: string
          minLength: 1
          maxLength: 80
        last_name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        subject:
          $ref: '#/components/schemas/ContactSubject'
        message:
          type: string
          minLength: 10
          maxLength: 8000
        phone:
          type: string
          minLength: 6
          maxLength: 32
          pattern: "^[+0-9().\\s-]+$"
        company:
          type: string
          maxLength: 160
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          maxLength: 128
        message:
          type: string
          maxLength: 256
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type:
          type: string
          examples:
            - urn:thl:problem:validation-error
        title:
          type: string
          maxLength: 128
        status:
          type: integer
        detail:
          type: string
          maxLength: 512
        instance:
          type: string
          format: uri-reference
          maxLength: 256
        code:
          type: string
          maxLength: 64
        correlation_id:
          type: string
          maxLength: 64
        errors:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/FieldError'
    HealthLive:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    HealthReady:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, fail]
  responses:
    BadRequestProblem:
      description: JSON malformé ou en-tête invalide
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:thl:problem:malformed-request
            title: Requête invalide
            status: 400
            detail: La requête n'a pas pu être lue.
            code: MALFORMED_REQUEST
            correlation_id: corr-fictif-001
    UnprocessableProblem:
      description: Schéma ou règle métier invalide (post-Pydantic)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:thl:problem:validation-error
            title: Données invalides
            status: 422
            detail: Une ou plusieurs valeurs sont incorrectes.
            code: VALIDATION_ERROR
            correlation_id: corr-fictif-002
            errors:
              - field: email
                message: Format email invalide.
    ForbiddenProblem:
      description: Refus générique (honeypot, Turnstile)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:thl:problem:request-denied
            title: Demande refusée
            status: 403
            detail: La demande n'a pas pu être acceptée.
            code: REQUEST_DENIED
            correlation_id: corr-fictif-003
    IdempotencyConflict:
      description: Même Idempotency-Key avec payload différent
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:thl:problem:idempotency-conflict
            title: Conflit d'idempotence
            status: 409
            detail: Cette clé a déjà été utilisée avec un contenu différent.
            code: IDEMPOTENCY_CONFLICT
            correlation_id: corr-fictif-004
    RateLimited:
      description: Trop de requêtes
      headers:
        Retry-After:
          schema:
            type: integer
            description: Délai en secondes
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:thl:problem:rate-limited
            title: Trop de requêtes
            status: 429
            detail: Réessayez plus tard.
            code: RATE_LIMITED
            correlation_id: corr-fictif-005
    PayloadTooLarge:
      description: Corps > 64 KiB
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:thl:problem:payload-too-large
            title: Payload trop volumineux
            status: 413
            code: PAYLOAD_TOO_LARGE
            correlation_id: corr-fictif-006
    UnsupportedMediaType:
      description: Content-Type non application/json
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: Dépendance requise indisponible (Turnstile, etc.)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:thl:problem:dependency-unavailable
            title: Service temporairement indisponible
            status: 503
            detail: Impossible de traiter la demande pour le moment.
            code: DEPENDENCY_UNAVAILABLE
            correlation_id: corr-fictif-007
