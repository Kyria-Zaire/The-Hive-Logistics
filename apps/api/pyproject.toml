[project]
name = "thl-api"
version = "0.1.0"
description = "THE HIVE LOGISTICS — API FastAPI (socle foundation)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "types-PyYAML>=6.0.12.20240917",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests", "src"]
markers = [
    "integration: requires PostgreSQL DEV (docker compose)",
    "migrations: requires PostgreSQL DEV and temporary thl_test_ database",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["thl_api"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
